name: Build and push

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * 0"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # renovate: datasource=repology depName=homebrew/postgresql@19 versioning=loose
  LATEST_POSTGRES_VERSION: "19.0"

permissions: {}

jobs:
  target-images:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    env:
      # Reuse layers from previously published images.
      CACHE_FROM: |
        type=registry,ref=ghcr.io/${{ github.repository }}:${{ matrix.pg_target.PG_VERSION }}-${{ matrix.operating_system.flavor }}
        type=registry,ref=ghcr.io/${{ github.repository }}:${{ matrix.pg_target.PG_VERSION }}-${{ matrix.operating_system.flavor }}${{ matrix.operating_system.OS_VERSION }}
        type=registry,ref=ghcr.io/${{ github.repository }}:${{ matrix.pg_target.PG_VERSION }}-${{ matrix.operating_system.alias }}

    strategy:
      matrix:
        operating_system:
          - flavor: "alpine"
            # renovate: datasource=docker depName=alpine versioning=docker
            OS_VERSION: "3.24"
            alias: "alpine"
          - flavor: "trixie"
            alias: "debian"
        pg_target:
          - # renovate: datasource=repology depName=homebrew/postgresql@16 versioning=loose
            PG_VERSION: "16.16"
          - # renovate: datasource=repology depName=homebrew/postgresql@17 versioning=loose
            PG_VERSION: "17.12"
          - # renovate: datasource=repology depName=homebrew/postgresql@18 versioning=loose
            PG_VERSION: "18.7"
          - # renovate: datasource=repology depName=homebrew/postgresql@19 versioning=loose
            PG_VERSION: "19.0"

    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log into registry ${{ env.REGISTRY }}
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          # add a .0 to each Postgres version so it is compliant with semantic version
          # note that the .0 never ends up on an actual tag
          tags: |
            type=semver,pattern={{major}},value=${{ matrix.pg_target.PG_VERSION }}.0,suffix=-${{ matrix.operating_system.flavor }}
            type=semver,pattern={{major}}.{{minor}},value=${{ matrix.pg_target.PG_VERSION }}.0,suffix=-${{ matrix.operating_system.flavor }}
            type=semver,pattern={{major}},value=${{ matrix.pg_target.PG_VERSION }}.0,suffix=-${{ matrix.operating_system.flavor }}${{ matrix.operating_system.OS_VERSION }}
            type=semver,pattern={{major}}.{{minor}},value=${{ matrix.pg_target.PG_VERSION }}.0,suffix=-${{ matrix.operating_system.flavor }}${{ matrix.operating_system.OS_VERSION }}
            type=semver,pattern={{major}},value=${{ matrix.pg_target.PG_VERSION }}.0,suffix=-${{ matrix.operating_system.alias }}
            type=semver,pattern={{major}}.{{minor}},value=${{ matrix.pg_target.PG_VERSION }}.0,suffix=-${{ matrix.operating_system.alias }}

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          file: "Dockerfile.${{ matrix.operating_system.flavor }}"
          load: true
          # Keep the local tag used by the test Compose files.
          tags: |
            ${{ steps.meta.outputs.tags }}
            pgautoupgrade/pgautoupgrade:${{ matrix.pg_target.PG_VERSION }}-${{ matrix.operating_system.flavor }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            "PGTARGET=${{ matrix.pg_target.PG_VERSION }}"
          cache-to: type=inline
          cache-from: "${{ env.CACHE_FROM }}"

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test image
        run: |
          make test
        env:
          PGTARGET: ${{ matrix.pg_target.PG_VERSION }}
          OS_FLAVOR: ${{ matrix.operating_system.flavor }}

      - name: Print container logs on failure
        if: failure()
        run: |
          docker compose -f test/docker-compose-pgauto.yml logs --no-color
          sudo find test/postgres-data -type f -path '*/pg_upgrade_output.d/*/log/*' -exec grep -nH -C 5 -E 'ERROR|FATAL|error:' {} + || true

      # otherwise, we run into space problems
      # from observation, the buildx builder container already occupies 7 GB out of the 14 GB we have available on a GitHub Actions runner
      # note that this command will also destroy the pgautoupgrade image we just build
      # which is intentional, the buildx builder should contain all information still to re-create the same image
      - name: Cleanup Docker image before pushing
        if: github.ref == 'refs/heads/main'
        run: |
          docker image prune -a -f

      - name: Push image
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          file: "Dockerfile.${{ matrix.operating_system.flavor }}"
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            "PGTARGET=${{ matrix.pg_target.PG_VERSION }}"
          push: true
          cache-to: type=inline
          cache-from: "${{ env.CACHE_FROM }}"

      - name: Push latest image for each supported OS
        if: github.ref == 'refs/heads/main' && matrix.pg_target.PG_VERSION == env.LATEST_POSTGRES_VERSION
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          file: "Dockerfile.${{ matrix.operating_system.flavor }}"
          platforms: linux/amd64,linux/arm64
          tags: |
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.operating_system.flavor }}"
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.operating_system.alias }}"
          build-args: |
            "PGTARGET=${{ matrix.pg_target.PG_VERSION }}"
          push: true
          cache-to: type=inline
          cache-from: "${{ env.CACHE_FROM }}"

      - name: Push general latest image
        if: github.ref == 'refs/heads/main' && matrix.pg_target.PG_VERSION == env.LATEST_POSTGRES_VERSION && matrix.operating_system.flavor == 'alpine'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          file: "Dockerfile.${{ matrix.operating_system.flavor }}"
          platforms: linux/amd64,linux/arm64
          tags: |
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          build-args: |
            "PGTARGET=${{ matrix.pg_target.PG_VERSION }}"
          push: true
          cache-to: type=inline
          cache-from: "${{ env.CACHE_FROM }}"
